
name: Container Security

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gloomy-penguin-kim/onboarding-tsx

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push hardened image
        id: build
        uses: docker/build-push-action@v6
        env:
          DATABASE_ENV_FILE: ${{ secrets.DATABASE_ENV_FILE }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/gloomy-penguin-kim/onboarding-tsx:latest
          secret-envs: |
            envfile=DATABASE_ENV_FILE

      - name: Sign image with Cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity \
              "https://github.com/gloomy-penguin-kim/onboarding-tsx/.github/workflows/container-security.yml@refs/heads/main" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
